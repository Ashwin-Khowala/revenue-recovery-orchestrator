[pytest]
# Force UTF-8 so deepeval Rich emoji don't crash CP1252 Windows terminals
env =
    PYTHONIOENCODING=utf-8
    PYTHONUTF8=1
    NO_COLOR=1
    CONFIDENT_BROWSER_OPEN=NO
    CONFIDENT_TRACE_VERBOSE=0
    DISABLE_AUDIT_DB=true
    DISABLE_REAL_TELEGRAM=true
    ENVIRONMENT=batch_eval


addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
